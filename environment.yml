name: rl_env_39
channels:
  - https://repo.anaconda.com/pkgs/main
  - https://repo.anaconda.com/pkgs/r
dependencies:
  - python=3.9
  - pip
  - pip: # make sure you install right version of cuda (massive requires 11.1)
    - numpy==1.22.0
    - torch==1.9.1+cu111 --find-links https://download.pytorch.org/whl/torch_stable.html
    - torchvision==0.10.1+cu111 --find-links https://download.pytorch.org/whl/torch_stable.html
    - gym==0.17.2
    - seaborn
    - tensorflow==2.11.0
    - git+https://github.com/Farama-Foundation/Metaworld.git@08489b46faffe3bfdeaa1287fa108260e74e194d # hopefully last commit before mujoco upgrade
    - -f=https://download.pytorch.org/whl/torch_stable.html

